[project]
name = "prinprin"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic[tz]>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.17.2",
]


[tool.ruff.lint.per-file-ignores]
"src/marusya/cli/console.py" = ["BLE001"]

[tool.ruff.lint.isort]
force-single-line = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marusya"]
